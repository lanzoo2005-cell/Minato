<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINATO - The Yellow Flash</title>

<link rel="stylesheet" href="style.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050b18;
color:white;
overflow-x:hidden;
}

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
background:radial-gradient(circle,#17376b,#050b18);
}

h1{
font-size:70px;
color:#ffd54a;
text-shadow:0 0 20px gold;
}

p{
margin-top:20px;
font-size:20px;
color:#ddd;
max-width:700px;
}

button{
margin-top:35px;
padding:15px 35px;
background:#ffd54a;
border:none;
border-radius:40px;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.1);
box-shadow:0 0 25px gold;
}

footer{
text-align:center;
padding:30px;
background:#091224;
}
</style>

</head>

</button>

<footer>
